<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patrulles Balastegui">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#185FA5">
<title>Patrulles - Sargento Balastegui</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css'">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, Roboto, Arial, sans-serif; background: #f0f0f0; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

/* CAPÇALERA */
#header { background: #185FA5; color: #fff; padding-top: env(safe-area-inset-top, 0px); flex: 0 0 auto; }
#header-inner { display: flex; align-items: center; gap: 8px; padding: 8px 12px 6px; }
#header-title { font-size: 13px; font-weight: bold; flex: 1; line-height: 1.3; }
#header-title span { display: block; font-size: 11px; font-weight: normal; opacity: .85; }

#status { background: #eef4ff; color: #185FA5; font-size: 12px; padding: 5px 12px; border-bottom: 1px solid #d0e0f5; flex: 0 0 auto; min-height: 26px; }
#status.armed { background: #fff1e6; color: #b34700; border-color: #f3c9a8; font-weight: bold; }

/* MAPA */
#map-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
#map { position: absolute; inset: 0; }
#map.armed canvas { cursor: crosshair; }

/* BOTONS FLOTANTS DEL MAPA */
.fab-col { position: absolute; right: 10px; bottom: 14px; z-index: 5; display: flex; flex-direction: column; gap: 10px; }
.fab { width: 46px; height: 46px; border-radius: 50%; border: none; background: #fff; color: #444;
  box-shadow: 0 2px 6px rgba(0,0,0,.3); font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.fab:active { background: #e8f0fe; }
.fab small { font-size: 12px; }
#fab-gps.on { color: #1a73e8; }
#fab-gps.follow { color: #fff; background: #1a73e8; }
#fab-gps.heading { color: #fff; background: #0b4fb3; }
#fab-gps { width: 58px; height: 58px; flex-direction: column; border: 2px solid #1a73e8; color: #1a73e8; }
#fab-gps svg { width: 24px; height: 24px; }
#fab-gps .lbl { font-size: 10px; line-height: 1; margin-top: 1px; }
.fab-col { align-items: center; }

#layer-menu { position: absolute; right: 64px; bottom: 14px; z-index: 6; background: #fff; border-radius: 10px;
  box-shadow: 0 2px 10px rgba(0,0,0,.3); padding: 6px; display: none; min-width: 190px; }
#layer-menu.visible { display: block; }
#layer-menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 10px; font-size: 14px; border-radius: 6px; }
#layer-menu button.sel { background: #e8f0fe; color: #185FA5; font-weight: bold; }

/* PISSARRA */
#board { flex: 0 0 auto; background: #fff; border-top: 1px solid #ddd; box-shadow: 0 -2px 10px rgba(0,0,0,.1);
  padding: 0 10px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); z-index: 10; }
#board-handle { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 4px; cursor: pointer; user-select: none; }
#board-handle b { font-size: 13px; color: #185FA5; }
#board-handle .count { font-size: 11px; color: #888; font-weight: normal; margin-left: 6px; }
#board-handle .arrow { font-size: 13px; color: #888; padding: 2px 8px; }
#board.collapsed #board-body { display: none; }
#board-body { max-height: 46vh; max-height: 46dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#board.typing #groups, #board.typing #author-bar { display: none; }
#map-wrap { min-height: 110px; }
.group { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
.group-label { flex: 0 0 62px; font-size: 10px; color: #888; text-transform: uppercase; padding-top: 8px; letter-spacing: .3px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 3px; padding: 6px 10px; border-radius: 18px;
  color: #fff; font-size: 13px; font-weight: bold; border: 2px solid transparent; touch-action: none; user-select: none;
  -webkit-user-select: none; cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.chip.deployed { background: #fff !important; border-style: solid; box-shadow: none; }
.chip.deployed::after { content: '\1F4CD'; font-size: 10px; margin-left: 2px; }
.chip.armed { outline: 3px solid #e65c00; outline-offset: 1px; }
.chip .del { margin-left: 4px; font-size: 13px; opacity: .8; padding: 0 2px; }
.chip .note-dot { width: 8px; height: 8px; border-radius: 50%; background: #e65c00; display: inline-block; margin-left: 2px; border: 1px solid #fff; }
#add-row { display: flex; gap: 6px; margin: 2px 0 8px; }
#btn-new { min-width: 44px; font-size: 18px; }
#new-name { flex: 1; min-width: 0; padding: 8px 10px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 14px; }
#new-name:focus { outline: none; border-color: #185FA5; }
#new-type { padding: 8px 4px; border: 1.5px solid #ccc; border-radius: 8px; font-size: 13px; background: #fff; }
.small-btn { padding: 8px 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; background: #185FA5; color: #fff; }
.small-btn.light { background: #f5f5f5; color: #c00; border: 1px solid #e0b0b0; }
#author-bar { font-size: 10px; color: #999; text-align: center; padding-top: 3px; border-top: 1px solid #eee; margin-top: 3px; }

/* FITXA QUE ES RIBOSSEGA */
#ghost { position: fixed; z-index: 3000; pointer-events: none; display: none; transform: translate(-50%, -100%); }

/* MARCADORS DEL MAPA */
.mk { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.mk-pill { position: relative; color: #fff; border-radius: 18px; padding: 5px 11px; font-size: 13px; font-weight: bold;
  white-space: nowrap; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.mk-tip { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid; }
.mk-dot { position: absolute; top: -5px; right: -5px; width: 11px; height: 11px; background: #e65c00; border-radius: 50%; border: 2px solid #fff; }
.mk.dragging .mk-pill { transform: scale(1.15); box-shadow: 0 6px 14px rgba(0,0,0,.45); }

/* LA MEVA POSICIÓ */
.me-wrap { position: relative; width: 120px; height: 120px; pointer-events: none; }
.me-beam { position: absolute; left: 0; top: 0; width: 120px; height: 120px; display: none; }
.me-dot { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
  background: #1a73e8; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.45); }
.me-dot.stale { background: #9aa0a6; }

/* FINESTRA DE NOTES */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 4000; align-items: flex-end; justify-content: center; }
#modal-overlay.visible { display: flex; }
#modal { background: #fff; border-radius: 16px 16px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
  width: 100%; max-width: 560px; box-shadow: 0 -4px 20px rgba(0,0,0,.2); max-height: 85vh; overflow-y: auto; }
#modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 14px; }
#modal h3 { font-size: 17px; margin-bottom: 2px; color: #222; }
#modal .subtitle { font-size: 12px; color: #888; margin-bottom: 10px; }
#modal textarea { width: 100%; height: 140px; border: 1.5px solid #ccc; border-radius: 8px; padding: 10px; font-size: 14px;
  resize: none; font-family: inherit; line-height: 1.5; }
#modal textarea:focus { outline: none; border-color: #185FA5; }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.modal-actions button { flex: 1; padding: 12px 6px; border-radius: 8px; font-size: 14px; font-weight: bold; border: none; }
#btn-save { background: #185FA5; color: #fff; }
#btn-cancel { background: #f0f0f0; color: #444; }
#btn-return { background: #fff0f0; color: #c00; border: 1px solid #e0b0b0; flex-basis: 100%; }

.maplibregl-ctrl-top-right { margin-top: 4px; }
</style>
</head>
<body>

<div id="header">
  <div id="header-inner">
    <div id="header-title">
      Mapa de Patrulles &#183; Sargento Balastegui
      <span>GUB &#183; Unitat Territorial Sant Mart&#237;</span>
    </div>
  </div>
</div>

<div id="status">Carregant mapa...</div>

<div id="map-wrap">
  <div id="map"></div>
  <div class="fab-col">
    <button class="fab" id="fab-layers" title="Tipus de mapa">&#128506;</button>
    <button class="fab" id="fab-180" title="Mitja volta"><small>180&#176;</small></button>
    <button class="fab" id="fab-gps" title="La meva ubicaci&#243;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg><span class="lbl">GPS</span>
    </button>
  </div>
  <div id="layer-menu">
    <button data-layer="vec">Carrers amb sentits (vectorial)</button>
    <button data-layer="osm">OpenStreetMap</button>
    <button data-layer="esri">Esri carrers</button>
    <button data-layer="sat">Sat&#232;l&#183;lit</button>
  </div>
</div>

<div id="board">
  <div id="board-handle">
    <b>Pissarra d'indicatius <span class="count" id="count"></span></b>
    <span class="arrow" id="board-arrow">&#9660;</span>
  </div>
  <div id="board-body">
    <div id="add-row">
      <input type="text" id="new-name" placeholder="Altre indicatiu (ex. EK191)" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters">
      <select id="new-type">
        <option value="auto">Auto</option>
        <option value="cotxe">Cotxe</option>
        <option value="furgo">Furgoneta</option>
        <option value="moto">Moto</option>
        <option value="peu">Peu</option>
        <option value="paisa">Pais&#224;</option>
      </select>
      <button class="small-btn" id="btn-new">+</button>
      <button class="small-btn light" id="btn-reset" title="Retirar tots del mapa">&#8634;</button>
    </div>
    <div id="groups"></div>
    <div id="author-bar">Sargento Francisco Gonz&#225;lez Balastegui &#183; Basada en l'app del caporal A. Moya de Pablos</div>
  </div>
</div>

<div id="ghost"></div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-handle"></div>
    <h3 id="modal-title"></h3>
    <div class="subtitle" id="modal-subtitle"></div>
    <textarea id="modal-notes" placeholder="Pr&#242;xims punts, tasques, observacions...&#10;&#10;Exemple:&#10;- 18:00 Ronda mercat&#10;- 19:30 C/ Pallars cantonada Rambla&#10;- Refor&#231; metro Clot"></textarea>
    <div class="modal-actions">
      <button id="btn-cancel">Cancel&#183;lar</button>
      <button id="btn-save">Guardar</button>
      <button id="btn-return">&#8617; Tornar a la pissarra</button>
    </div>
  </div>
</div>

<script>
// Carrega el motor del mapa (si unpkg falla, prova jsDelivr)
(function () {
  var urls = ['https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js',
              'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js'];
  function next(i) {
    if (i >= urls.length) { document.getElementById('status').textContent = 'No s\'ha pogut carregar el mapa. Revisa la connexi\u00f3 a internet i torna a obrir.'; return; }
    var sc = document.createElement('script'); sc.src = urls[i];
    sc.onload = function () {
      try { startApp(); }
      catch (e) { document.getElementById('status').textContent = 'Error en obrir el mapa: ' + (e && e.message ? e.message : e); }
    };
    sc.onerror = function () { next(i + 1); };
    document.head.appendChild(sc);
  }
  next(0);
})();

function startApp() {
// ===================== DADES =====================
var TYPES = {
  cotxe: { label: 'Cotxe',     group: 'Cotxes',    color: '#185FA5', emoji: '🚓' },
  furgo: { label: 'Furgoneta', group: 'Furgoneta', color: '#3B6D11', emoji: '🚐' },
  moto:  { label: 'Moto',      group: 'Motos',     color: '#BA7517', emoji: '🏍' },
  peu:   { label: 'A peu',     group: 'Altres',    color: '#5B4BA0', emoji: '🚶' },
  paisa: { label: 'Paisà',  group: 'Altres',    color: '#993556', emoji: '👤' }
};
var GROUP_ORDER = ['Cotxes', 'Furgoneta', 'Motos', 'Altres'];
var FIXED = ['E401', 'E402', 'E403', 'E404', 'E405', 'E411', 'E590', 'E201', 'E202', 'E203', 'E204', 'E205'];
var STORE_KEY = 'patrulles_balastegui_v2';

function typeFromName(name) {
  var m = /^E\s*(\d)/i.exec(name);
  if (m) { if (m[1] === '4') return 'cotxe'; if (m[1] === '5') return 'furgo'; if (m[1] === '2') return 'moto'; }
  return 'peu';
}

var units = [];   // {id, name, type, fixed, lng, lat, notes}
function load() {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  units = FIXED.map(function (n) { return { id: n, name: n, type: typeFromName(n), fixed: true, lng: null, lat: null, notes: '' }; });
  if (saved && saved.units) {
    saved.units.forEach(function (s) {
      var u = units.find(function (x) { return x.id === s.id; });
      if (u) { u.lng = s.lng; u.lat = s.lat; u.notes = s.notes || ''; }
      else if (!s.fixed) units.push({ id: s.id, name: s.name, type: TYPES[s.type] ? s.type : 'peu', fixed: false, lng: s.lng, lat: s.lat, notes: s.notes || '' });
    });
  }
  return saved;
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      units: units.map(function (u) { return { id: u.id, name: u.name, type: u.type, fixed: u.fixed, lng: u.lng, lat: u.lat, notes: u.notes }; }),
      view: map ? { c: map.getCenter().toArray(), z: map.getZoom(), b: map.getBearing() } : null,
      layer: currentLayer
    }));
  } catch (e) {}
}
var saved = load();

// ===================== MAPA =====================
function rasterStyle(tiles, attribution, maxzoom) {
  return { version: 8,
    sources: { r: { type: 'raster', tiles: tiles, tileSize: 256, maxzoom: maxzoom || 19, attribution: attribution } },
    layers: [{ id: 'r', type: 'raster', source: 'r' }] };
}
var STYLES = {
  vec:  'https://tiles.openfreemap.org/styles/liberty',
  osm:  rasterStyle(['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], '&copy; OpenStreetMap'),
  esri: rasterStyle(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'], 'Tiles &copy; Esri'),
  sat:  rasterStyle(['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], 'Imatge &copy; Esri', 19)
};
var currentLayer = (saved && STYLES[saved.layer]) ? saved.layer : (location.protocol === 'file:' ? 'esri' : 'vec');
var view = (saved && saved.view) || { c: [2.2020, 41.4065], z: 14, b: 0 };

var map = new maplibregl.Map({
  container: 'map',
  style: STYLES[currentLayer],
  center: view.c, zoom: view.z, bearing: view.b || 0,
  maxPitch: 60,
  attributionControl: false,
  dragRotate: true, touchZoomRotate: true, touchPitch: true
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true, showCompass: true }), 'top-right');
map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-left');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 90 }), 'bottom-left');

var styleOk = false, tileErrors = 0;
var FALLBACK = { vec: 'esri', osm: 'esri', esri: 'osm', sat: 'esri' };
var triedLayers = {};
map.on('style.load', function () { styleOk = true; addAccLayer(); });
map.on('error', function (e) {
  // si un mapa no carrega (servei caigut, bloquejat...), es canvia sol a un altre
  tileErrors++;
  if (!styleOk || tileErrors >= 4) {
    triedLayers[currentLayer] = true;
    var alt = FALLBACK[currentLayer];
    if (triedLayers[alt]) alt = Object.keys(STYLES).filter(function (k) { return !triedLayers[k]; })[0];
    if (alt) { var from = currentLayer; setLayer(alt); var NOMS = { vec: 'vectorial', osm: 'OpenStreetMap', esri: 'Esri', sat: 'sat\u00e8l\u00b7lit' };
      setStatus('El mapa ' + NOMS[from] + ' no carrega, canviat a ' + NOMS[alt] + '.'); }
  }
});
map.on('load', function () { setStatus('Arrossega un indicatiu de la pissarra fins al mapa.'); });
// si en 8 segons no arriba cap tros de mapa, es canvia a un altre tipus de mapa
var gotTile = false, tileTimer = null;
map.on('data', function (e) { if (e.dataType === 'source' && e.tile) gotTile = true; });
function watchTiles() {
  gotTile = false; clearTimeout(tileTimer);
  tileTimer = setTimeout(function () {
    if (gotTile) return;
    triedLayers[currentLayer] = true;
    var alt = FALLBACK[currentLayer];
    if (triedLayers[alt]) alt = Object.keys(STYLES).filter(function (k) { return !triedLayers[k]; })[0];
    if (alt) { var NOMS = { vec: 'vectorial', osm: 'OpenStreetMap', esri: 'Esri', sat: 'sat\u00e8l\u00b7lit' };
      var from = currentLayer; setLayer(alt); setStatus('El mapa ' + NOMS[from] + ' no carrega, canviat a ' + NOMS[alt] + '.'); }
  }, 8000);
}
watchTiles();
map.on('moveend', function () { save(); });

function setLayer(key) {
  if (!STYLES[key]) return;
  currentLayer = key; styleOk = false; tileErrors = 0;
  map.setStyle(STYLES[key], { diff: false });
  paintLayerMenu(); save(); watchTiles();
}
function paintLayerMenu() {
  document.querySelectorAll('#layer-menu button').forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-layer') === currentLayer); });
}
paintLayerMenu();
document.getElementById('fab-layers').onclick = function (e) { e.stopPropagation(); document.getElementById('layer-menu').classList.toggle('visible'); };
document.querySelectorAll('#layer-menu button').forEach(function (b) {
  b.onclick = function () { setLayer(b.getAttribute('data-layer')); document.getElementById('layer-menu').classList.remove('visible'); };
});
document.getElementById('fab-180').onclick = function () {
  map.easeTo({ bearing: map.getBearing() + 180, duration: 700 });
};

// ===================== MARCADORS =====================
var markers = {};      // id -> maplibregl.Marker
var armedId = null;    // indicatiu triat a la pissarra esperant un toc al mapa

function buildMarkerEl(u) {
  var t = TYPES[u.type];
  var el = document.createElement('div'); el.className = 'mk';
  var pill = document.createElement('div'); pill.className = 'mk-pill'; pill.style.background = t.color;
  pill.textContent = t.emoji + ' ' + u.name;
  if (u.notes && u.notes.trim()) { var d = document.createElement('span'); d.className = 'mk-dot'; pill.appendChild(d); }
  var tip = document.createElement('div'); tip.className = 'mk-tip'; tip.style.borderTopColor = t.color;
  el.appendChild(pill); el.appendChild(tip);
  return el;
}

function placeMarker(u) {
  if (markers[u.id]) { markers[u.id].remove(); delete markers[u.id]; }
  if (u.lng === null || u.lat === null) return;
  var el = buildMarkerEl(u);
  var mk = new maplibregl.Marker({ element: el, anchor: 'bottom', draggable: true })
    .setLngLat([u.lng, u.lat]).addTo(map);
  var moved = false;
  mk.on('dragstart', function () { moved = true; el.classList.add('dragging'); });
  mk.on('dragend', function () {
    el.classList.remove('dragging');
    var ll = mk.getLngLat(); u.lng = ll.lng; u.lat = ll.lat; save();
    setStatus('"' + u.name + '" moguda.');
    setTimeout(function () { moved = false; }, 250);
  });
  el.addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (moved) return;
    openModal(u.id);
  });
  markers[u.id] = mk;
}

function deploy(id, lngLat) {
  var u = units.find(function (x) { return x.id === id; }); if (!u) return;
  u.lng = lngLat.lng; u.lat = lngLat.lat;
  placeMarker(u); save(); renderBoard();
  setStatus('"' + u.name + '" situada al mapa. Arrossega-la per moure-la.');
}
function undeploy(id) {
  var u = units.find(function (x) { return x.id === id; }); if (!u) return;
  u.lng = null; u.lat = null; placeMarker(u); save(); renderBoard();
  setStatus('"' + u.name + '" tornada a la pissarra.');
}

map.on('click', function (e) {
  document.getElementById('layer-menu').classList.remove('visible');
  if (armedId) { var id = armedId; disarm(); deploy(id, e.lngLat); }
});

function arm(id) {
  armedId = id;
  document.getElementById('map').classList.add('armed');
  var u = units.find(function (x) { return x.id === id; });
  setStatus('Toca el mapa on vols situar ' + u.name + '. (Toca el xip una altra vegada per cancel·lar)', true);
  renderBoard();
}
function disarm() {
  armedId = null;
  document.getElementById('map').classList.remove('armed');
  setStatus(''); renderBoard();
}

// ===================== PISSARRA =====================
function renderBoard() {
  var groups = {};
  units.forEach(function (u) { var g = TYPES[u.type].group; (groups[g] = groups[g] || []).push(u); });
  var box = document.getElementById('groups'); box.innerHTML = '';
  GROUP_ORDER.forEach(function (g) {
    if (!groups[g]) return;
    var row = document.createElement('div'); row.className = 'group';
    var lab = document.createElement('div'); lab.className = 'group-label'; lab.textContent = g;
    var chips = document.createElement('div'); chips.className = 'chips';
    groups[g].forEach(function (u) { chips.appendChild(buildChip(u)); });
    row.appendChild(lab); row.appendChild(chips); box.appendChild(row);
  });
  var dep = units.filter(function (u) { return u.lat !== null; }).length;
  document.getElementById('count').textContent = dep + ' de ' + units.length + ' al mapa';
}

function buildChip(u) {
  var t = TYPES[u.type];
  var c = document.createElement('span');
  c.className = 'chip' + (u.lat !== null ? ' deployed' : '') + (armedId === u.id ? ' armed' : '');
  c.style.background = t.color;
  if (u.lat !== null) { c.style.color = t.color; c.style.borderColor = t.color; }
  c.appendChild(document.createTextNode(t.emoji + ' ' + u.name));
  if (u.notes && u.notes.trim()) { var nd = document.createElement('span'); nd.className = 'note-dot'; c.appendChild(nd); }
  if (!u.fixed) {
    var del = document.createElement('span'); del.className = 'del'; del.textContent = '×';
    del.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    del.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!confirm('Esborrar ' + u.name + ' de la pissarra?')) return;
      if (markers[u.id]) { markers[u.id].remove(); delete markers[u.id]; }
      units = units.filter(function (x) { return x.id !== u.id; });
      if (armedId === u.id) armedId = null;
      save(); renderBoard();
    });
    c.appendChild(del);
  }
  attachChipDrag(c, u);
  return c;
}

// Arrossegar un xip de la pissarra fins al mapa (funciona amb el dit i amb el ratolí)
var ghost = document.getElementById('ghost');
function attachChipDrag(chip, u) {
  var start = null, dragging = false;
  chip.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button > 0) return;
    start = { x: e.clientX, y: e.clientY }; dragging = false;
    try { chip.setPointerCapture(e.pointerId); } catch (err) {}
  });
  chip.addEventListener('pointermove', function (e) {
    if (!start) return;
    if (!dragging && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
      dragging = true;
      if (armedId) disarmQuiet();
      ghost.innerHTML = ''; ghost.appendChild(buildMarkerEl(u)); ghost.style.display = 'block';
    }
    if (dragging) {
      // la punta de la fitxa queda una mica per sobre del dit perquè es vegi on cau
      ghost.style.left = e.clientX + 'px'; ghost.style.top = (e.clientY - 28) + 'px';
      setStatus(overMap(e.clientX, e.clientY - 28) ? 'Deixa anar per situar ' + u.name + '.' : 'Porta ' + u.name + ' fins al mapa.', true);
    }
  });
  function end(e, cancelled) {
    if (!start) return;
    var wasDrag = dragging; start = null; dragging = false; ghost.style.display = 'none';
    if (wasDrag) {
      var x = e.clientX, y = e.clientY - 28;
      if (!cancelled && overMap(x, y)) {
        var r = document.getElementById('map').getBoundingClientRect();
        deploy(u.id, map.unproject([x - r.left, y - r.top]));
      } else setStatus('');
      return;
    }
    if (cancelled) return;
    // toc curt
    if (u.lat !== null) {
      map.easeTo({ center: [u.lng, u.lat], zoom: Math.max(map.getZoom(), 16), duration: 600 });
      openModal(u.id);
    } else if (armedId === u.id) disarm();
    else arm(u.id);
  }
  chip.addEventListener('pointerup', function (e) { end(e, false); });
  chip.addEventListener('pointercancel', function (e) { end(e, true); });
}
function disarmQuiet() { armedId = null; document.getElementById('map').classList.remove('armed'); }
function overMap(x, y) {
  var r = document.getElementById('map').getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

document.getElementById('board-handle').onclick = function () {
  var b = document.getElementById('board');
  b.classList.toggle('collapsed');
  document.getElementById('board-arrow').innerHTML = b.classList.contains('collapsed') ? '&#9650;' : '&#9660;';
  setTimeout(function () { map.resize(); }, 50);
};

document.getElementById('btn-new').onclick = function () {
  var inp = document.getElementById('new-name');
  var name = inp.value.trim().toUpperCase().replace(/\s+/g, '');
  if (!name) { setStatus('Escriu l\'indicatiu primer.'); return; }
  if (units.some(function (u) { return u.name === name; })) { setStatus(name + ' ja és a la pissarra, no cal afegir-lo.', true); return; }
  var sel = document.getElementById('new-type').value;
  var type = sel === 'auto' ? typeFromName(name) : sel;
  units.push({ id: 'c' + Date.now(), name: name, type: type, fixed: false, lng: null, lat: null, notes: '' });
  inp.value = ''; inp.blur(); save(); renderBoard();
  setStatus(name + ' afegit. Arrossega\'l al mapa o toca\'l i despr\u00e9s toca el mapa.');
};
var newInp = document.getElementById('new-name');
newInp.addEventListener('focus', function () { document.getElementById('board').classList.add('typing'); setTimeout(function () { map.resize(); }, 300); });
newInp.addEventListener('blur', function () { setTimeout(function () { document.getElementById('board').classList.remove('typing'); map.resize(); }, 200); });
document.getElementById('new-name').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('btn-new').click(); });

document.getElementById('btn-reset').onclick = function () {
  if (!units.some(function (u) { return u.lat !== null; })) { setStatus('No hi ha cap indicatiu al mapa.'); return; }
  if (!confirm('Tornar tots els indicatius a la pissarra?')) return;
  units.forEach(function (u) { u.lng = null; u.lat = null; placeMarker(u); });
  save(); renderBoard(); setStatus('Mapa net. Tots els indicatius són a la pissarra.');
};

// ===================== NOTES =====================
var modalId = null;
function openModal(id) {
  var u = units.find(function (x) { return x.id === id; }); if (!u) return;
  modalId = id;
  document.getElementById('modal-title').textContent = TYPES[u.type].emoji + ' ' + u.name;
  document.getElementById('modal-subtitle').textContent = TYPES[u.type].label + (u.lat !== null ? ' · al mapa' : ' · a la pissarra');
  document.getElementById('modal-notes').value = u.notes || '';
  document.getElementById('btn-return').style.display = u.lat !== null ? '' : 'none';
  document.getElementById('modal-overlay').classList.add('visible');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('visible'); modalId = null; }
document.getElementById('modal-overlay').addEventListener('click', function (e) { if (e.target.id === 'modal-overlay') closeModal(); });
document.getElementById('btn-cancel').onclick = closeModal;
document.getElementById('btn-save').onclick = function () {
  var u = units.find(function (x) { return x.id === modalId; }); if (!u) return;
  u.notes = document.getElementById('modal-notes').value;
  placeMarker(u); save(); renderBoard(); closeModal();
  setStatus('Notes de "' + u.name + '" guardades.');
};
document.getElementById('btn-return').onclick = function () { var id = modalId; closeModal(); undeploy(id); };

var statusTimer = null;
function setStatus(msg, armedLook) {
  var s = document.getElementById('status');
  if (!msg) msg = armedId ? s.textContent : 'Arrossega un indicatiu al mapa, o toca\'l i després toca el mapa.';
  s.textContent = msg;
  s.classList.toggle('armed', !!armedLook || !!armedId);
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (modalId) closeModal(); else if (armedId) disarm(); }
});

renderBoard();
units.forEach(placeMarker);

// ===================== LOCALITZADOR GPS (estil Google Maps) =====================
// 1r toc: activa i segueix · 2n toc: el mapa gira amb la teva direcció · 3r toc: desactiva
// Si mous el mapa amb el dit deixa de seguir-te; torna a tocar el botó per centrar.
var gps = { mode: 'off', watchId: null, marker: null, pos: null, acc: 0, compass: null, gpsHead: null, moving: false, lastFix: 0, wake: null };
var BEAM_SVG = '<svg class="me-beam" viewBox="0 0 120 120"><defs><radialGradient id="meg" cx="60" cy="60" r="56" gradientUnits="userSpaceOnUse">'
  + '<stop offset="0" stop-color="#1a73e8" stop-opacity=".75"/><stop offset="1" stop-color="#1a73e8" stop-opacity="0"/></radialGradient></defs>'
  + '<path d="M60 60 L32.5 12.4 A55 55 0 0 1 87.5 12.4 Z" fill="url(#meg)"/></svg>';

function addAccLayer() {
  if (map.getSource('acc')) return;
  map.addSource('acc', { type: 'geojson', data: accGeo() });
  map.addLayer({ id: 'acc-fill', type: 'fill', source: 'acc', paint: { 'fill-color': '#1a73e8', 'fill-opacity': 0.12 } });
  map.addLayer({ id: 'acc-line', type: 'line', source: 'acc', paint: { 'line-color': '#1a73e8', 'line-opacity': 0.4, 'line-width': 1 } });
}
function accGeo() {
  if (!gps.pos || gps.mode === 'off') return { type: 'FeatureCollection', features: [] };
  var pts = [], lat = gps.pos[1] * Math.PI / 180, n = 48;
  for (var i = 0; i <= n; i++) {
    var a = (i / n) * 2 * Math.PI;
    pts.push([gps.pos[0] + (gps.acc * Math.sin(a)) / (111320 * Math.cos(lat)), gps.pos[1] + (gps.acc * Math.cos(a)) / 110540]);
  }
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] } };
}
function updAcc() { var s = map.getSource('acc'); if (s) s.setData(accGeo()); }

function paintGps() { document.getElementById('fab-gps').className = 'fab ' + (gps.mode === 'off' ? '' : gps.mode); }

document.getElementById('fab-gps').onclick = function () {
  if (gps.mode === 'off') {
    if (!('geolocation' in navigator)) { setStatus('Aquest navegador no dona la ubicació.'); return; }
    gps.mode = 'follow'; paintGps();
    setStatus('Buscant la teva posició GPS...');
    gps.watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    startCompass(); keepAwake();
  } else if (gps.mode === 'on') {
    gps.mode = 'follow'; paintGps();
    if (gps.pos) map.easeTo({ center: gps.pos, zoom: Math.max(map.getZoom(), 17), duration: 600 });
  } else if (gps.mode === 'follow') {
    gps.mode = 'heading'; paintGps();
    setStatus('Mode brúixola: el mapa gira cap on mires.');
    if (gps.pos) map.easeTo({ center: gps.pos, zoom: Math.max(map.getZoom(), 17), duration: 400 });
  } else {
    navigator.geolocation.clearWatch(gps.watchId); gps.mode = 'off'; paintGps();
    if (gps.marker) { gps.marker.remove(); gps.marker = null; }
    gps.pos = null; updAcc();
    try { if (gps.wake) gps.wake.release(); } catch (e) {}
    map.easeTo({ bearing: 0, pitch: 0, duration: 500 });
    setStatus('Localització desactivada.');
  }
};
// si l'usuari mou o gira el mapa amb el dit, deixem de seguir-lo
map.on('dragstart', function (e) { if (e.originalEvent && (gps.mode === 'follow' || gps.mode === 'heading')) { gps.mode = 'on'; paintGps(); } });
map.on('rotatestart', function (e) { if (e.originalEvent && gps.mode === 'heading') { gps.mode = 'follow'; paintGps(); } });

function onPos(p) {
  gps.pos = [p.coords.longitude, p.coords.latitude]; gps.acc = p.coords.accuracy;
  var hd = p.coords.heading, sp = p.coords.speed;
  gps.moving = (sp !== null && sp > 1.5 && hd !== null && !isNaN(hd));
  gps.gpsHead = gps.moving ? hd : null; gps.lastFix = Date.now();
  var first = !gps.marker;
  if (first) {
    var el = document.createElement('div'); el.className = 'me-wrap'; el.innerHTML = BEAM_SVG + '<div class="me-dot"></div>';
    gps.marker = new maplibregl.Marker({ element: el, rotationAlignment: 'map', pitchAlignment: 'map' }).setLngLat(gps.pos).addTo(map);
  } else gps.marker.setLngLat(gps.pos);
  var dot = gps.marker.getElement().querySelector('.me-dot'); if (dot) dot.classList.remove('stale');
  updAcc();
  var headingNow = gps.moving ? gps.gpsHead : gps.compass;
  if (gps.mode === 'follow' || gps.mode === 'heading') {
    if (first) map.jumpTo({ center: gps.pos, zoom: Math.max(map.getZoom(), 17) });
    else if (!(gps.mode === 'heading' && headingNow !== null)) map.easeTo({ center: gps.pos, duration: 600 });
  }
  updBeam();
  setStatus('Ubicació activa · precisió ±' + Math.round(gps.acc) + ' m' + (gps.moving ? ' · ' + Math.round(sp * 3.6) + ' km/h' : ''));
}
function onErr(e) {
  if (e.code === 1) { setStatus('Permís d\'ubicació denegat. Activa\'l al cadenat de la barra d\'adreces → Ubicació.'); gps.mode = 'off'; paintGps(); }
  else if (e.code === 3) setStatus('El GPS triga a respondre, continuo provant...');
  else setStatus('No s\'ha pogut obtenir la ubicació.');
}
setInterval(function () {
  if (gps.marker && Date.now() - gps.lastFix > 30000) { var d = gps.marker.getElement().querySelector('.me-dot'); if (d) d.classList.add('stale'); }
}, 5000);

// ---- brúixola
function screenAngle() { try { return (screen.orientation && screen.orientation.angle) || window.orientation || 0; } catch (e) { return 0; } }
function onOrient(e) {
  var h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha !== null) h = 360 - e.alpha;
  if (h === null) return;
  h = (h + screenAngle() + 360) % 360;
  if (gps.compass === null) gps.compass = h;
  else { var d = ((h - gps.compass + 540) % 360) - 180; gps.compass = (gps.compass + d * 0.25 + 360) % 360; }
  updBeam();
}
var orientOn = false;
function startCompass() {
  if (orientOn) return; orientOn = true;
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(function (r) { if (r === 'granted') window.addEventListener('deviceorientation', onOrient); }).catch(function () {});
    } else if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrient);
    else window.addEventListener('deviceorientation', onOrient);
  } catch (e) {}
}
var lastRotate = 0;
function updBeam() {
  if (!gps.marker) return;
  var beam = gps.marker.getElement().querySelector('.me-beam');
  var h = gps.moving ? gps.gpsHead : gps.compass;
  if (h === null) { beam.style.display = 'none'; return; }
  beam.style.display = 'block';
  gps.marker.setRotation(h);   // el feix apunta al nord real encara que el mapa estigui girat
  if (gps.mode === 'heading') {
    var now = Date.now();
    if (now - lastRotate > 120) { lastRotate = now; map.easeTo({ center: gps.pos, bearing: h, duration: 150, easing: function (t) { return t; } }); }
  }
}
async function keepAwake() { try { if ('wakeLock' in navigator) gps.wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', function () { if (gps.mode !== 'off' && document.visibilityState === 'visible') keepAwake(); });

window._app = { map: map, deploy: deploy, units: function () { return units; }, setLayer: setLayer };
}
</script>
</body>
